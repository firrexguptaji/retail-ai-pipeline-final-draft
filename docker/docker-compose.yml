version: "3.9"

services:
  detector:
    build:
      context: ..
      dockerfile: detector_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ../models:/models
      - ../outputs:/outputs
    environment:
      - SERVICE_NAME=detector
      - OUTPUT_DIR=/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  grouping:
    build:
      context: ..
      dockerfile: grouping_service/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ~/.cache/torch:/root/.cache/torch
      - ../outputs:/outputs
    environment:
      - SERVICE_NAME=grouping
      - OUTPUT_DIR=/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      detector:
        condition: service_healthy
      grouping:
        condition: service_healthy
    environment:
      - SERVICE_NAME=gateway
      - DETECTOR_BASE_URL=http://detector:8001
      - GROUPING_BASE_URL=http://grouping:8002
      - OUTPUT_DIR=/outputs
    volumes:
      - ../outputs:/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3